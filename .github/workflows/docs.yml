name: Docs

on:
  pull_request:
  push:
    branches: [main, phase13.2-complete-review]
    paths-ignore:
      - docs/audits/current/**

permissions:
  contents: read

concurrency:
  group: blendops-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Rebuild architecture inventory and synchronize audit digest
        shell: bash
        run: |
          npm run arch:build
          npm run audit:sync-digest
      - name: Mint repository-scoped ThanhNguyxnAgent token
        if: github.event_name == 'push'
        id: agent
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@da9d02544f60aeec92f8c851846ee3a587044beb
        with:
          profile: content
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Persist regenerated audit snapshots as ThanhNguyxnAgent
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.agent.outputs.token }}
          script: |
            const fs = require('fs');
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const paths = [
              'docs/audits/current/repository-inventory.json',
              'docs/audits/current/scorecard.json',
              'docs/audits/current/findings.json',
              'docs/audits/current/skill-inventory.json',
              'docs/audits/current/eval-inventory.json',
              'docs/audits/current/verification-manifest.json',
            ];

            const refResult = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });
            const parentSha = refResult.data.object.sha;
            const parentResult = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: parentSha,
            });

            const tree = [];
            for (const path of paths) {
              const localContent = fs.readFileSync(path, 'utf8');
              const remoteResult = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              const remoteContent = Buffer.from(remoteResult.data.content, 'base64').toString('utf8');
              if (remoteContent === localContent) {
                core.info(`Already synchronized: ${path}`);
                continue;
              }
              const blob = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: localContent,
                encoding: 'utf-8',
              });
              tree.push({
                path,
                mode: '100644',
                type: 'blob',
                sha: blob.data.sha,
              });
            }

            if (tree.length === 0) {
              core.info('No generated audit snapshots need to be committed.');
              return;
            }

            const newTree = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: parentResult.data.tree.sha,
              tree,
            });
            const newCommit = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: 'chore(agent): refresh generated BlendOps audit snapshots',
              tree: newTree.data.sha,
              parents: [parentSha],
              author: {
                name: 'ThanhNguyxnAgent[bot]',
                email: '296222857+thanhnguyxnagent[bot]@users.noreply.github.com',
              },
              committer: {
                name: 'ThanhNguyxnAgent[bot]',
                email: '296222857+thanhnguyxnagent[bot]@users.noreply.github.com',
              },
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
              sha: newCommit.data.sha,
              force: false,
            });
            core.info(`Committed regenerated audit snapshots: ${newCommit.data.sha}`);

      - run: npm run arch:check

  cli-cross-platform:
    name: cli-cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Rebuild architecture inventory and synchronize audit digest
        shell: bash
        run: |
          npm run arch:build
          npm run audit:sync-digest
      - run: node --test scripts/test-phase11.mjs scripts/test-phase12.mjs scripts/test-phase13.mjs
