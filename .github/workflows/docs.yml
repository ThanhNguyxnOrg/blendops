name: Docs

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - docs/audits/current/**

permissions:
  contents: read

concurrency:
  group: blendops-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Rebuild architecture inventory and synchronize audit digest
        shell: bash
        run: |
          npm run arch:build
          npm run audit:sync-digest
      # NOTE: generated audit snapshots are intentionally NOT committed
      # here. Authors regenerate them locally (npm run arch:build &&
      # npm run audit:sync-digest); CI regenerates them in-runner
      # before testing, so a stale committed snapshot can never
      # break a PR check.
      - run: npm run arch:check

  cli-cross-platform:
    name: cli-cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
    matrix:
      os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Rebuild architecture inventory and synchronize audit digest
        shell: bash
        run: |
          npm run arch:build
          npm run audit:sync-digest
      - run: node --test scripts/test-cli-package.mjs scripts/test-glb-handoff.mjs scripts/test-repository-architecture.mjs
