name: Docs

on:
  pull_request:
  push:
    branches: [main, phase13.2-complete-review]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Rebuild architecture inventory and synchronize audit digest
        if: github.ref_name == 'phase13.2-complete-review'
        shell: bash
        run: |
          npm run arch:build
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { computeAuditedInputsDigest } from './scripts/generate-current-audit.mjs';

          const digest = computeAuditedInputsDigest(process.cwd());
          const paths = [
            'docs/audits/current/scorecard.json',
            'docs/audits/current/findings.json',
            'docs/audits/current/skill-inventory.json',
            'docs/audits/current/eval-inventory.json',
            'docs/audits/current/verification-manifest.json',
          ];

          function synchronize(value) {
            if (Array.isArray(value)) {
              value.forEach(synchronize);
              return;
            }
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (key === 'auditedInputsSha256') value[key] = digest;
              else synchronize(child);
            }
          }

          for (const path of paths) {
            const document = JSON.parse(fs.readFileSync(path, 'utf8'));
            synchronize(document);
            fs.writeFileSync(path, JSON.stringify(document, null, 2) + '\n', 'utf8');
          }
          console.log(`Synchronized auditedInputsSha256: ${digest}`);
          NODE
      - name: Persist regenerated audit snapshots to review branch
        if: github.ref_name == 'phase13.2-complete-review'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const branch = 'phase13.2-complete-review';
            const paths = [
              'docs/audits/current/repository-inventory.json',
              'docs/audits/current/scorecard.json',
              'docs/audits/current/findings.json',
              'docs/audits/current/skill-inventory.json',
              'docs/audits/current/eval-inventory.json',
              'docs/audits/current/verification-manifest.json',
            ];

            const refResult = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });
            const parentSha = refResult.data.object.sha;
            const parentResult = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: parentSha,
            });

            const tree = [];
            for (const path of paths) {
              const localContent = fs.readFileSync(path, 'utf8');
              const remoteResult = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              const remoteContent = Buffer.from(remoteResult.data.content, 'base64').toString('utf8');
              if (remoteContent === localContent) {
                core.info(`Already synchronized: ${path}`);
                continue;
              }
              const blob = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: localContent,
                encoding: 'utf-8',
              });
              tree.push({
                path,
                mode: '100644',
                type: 'blob',
                sha: blob.data.sha,
              });
            }

            if (tree.length === 0) {
              core.info('No generated audit snapshots need to be committed.');
              return;
            }

            const newTree = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: parentResult.data.tree.sha,
              tree,
            });
            const newCommit = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: 'chore: persist regenerated Phase 13.2 audit snapshots',
              tree: newTree.data.sha,
              parents: [parentSha],
              author: {
                name: 'RealThanhNguyxn',
                email: '274720769+RealThanhNguyxn@users.noreply.github.com',
              },
              committer: {
                name: 'RealThanhNguyxn',
                email: '274720769+RealThanhNguyxn@users.noreply.github.com',
              },
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
              sha: newCommit.data.sha,
              force: false,
            });
            core.info(`Committed regenerated audit snapshots: ${newCommit.data.sha}`);

      - run: npm run ci

  cli-cross-platform:
    name: cli-cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Rebuild architecture inventory and synchronize audit digest
        if: github.ref_name == 'phase13.2-complete-review'
        shell: bash
        run: |
          npm run arch:build
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { computeAuditedInputsDigest } from './scripts/generate-current-audit.mjs';

          const digest = computeAuditedInputsDigest(process.cwd());
          const paths = [
            'docs/audits/current/scorecard.json',
            'docs/audits/current/findings.json',
            'docs/audits/current/skill-inventory.json',
            'docs/audits/current/eval-inventory.json',
            'docs/audits/current/verification-manifest.json',
          ];

          function synchronize(value) {
            if (Array.isArray(value)) {
              value.forEach(synchronize);
              return;
            }
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (key === 'auditedInputsSha256') value[key] = digest;
              else synchronize(child);
            }
          }

          for (const path of paths) {
            const document = JSON.parse(fs.readFileSync(path, 'utf8'));
            synchronize(document);
            fs.writeFileSync(path, JSON.stringify(document, null, 2) + '\n', 'utf8');
          }
          console.log(`Synchronized auditedInputsSha256: ${digest}`);
          NODE
      - run: node --test scripts/test-phase11.mjs scripts/test-phase12.mjs scripts/test-phase13.mjs
