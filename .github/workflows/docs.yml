name: Docs

on:
  pull_request:
  push:
    branches: [main, phase13.2-complete-review]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Rebuild architecture inventory on review branch
        if: github.ref_name == 'phase13.2-complete-review'
        run: |
          npm run arch:build
          git diff -- docs/audits/current/repository-inventory.json
      - run: npm run ci

  cli-cross-platform:
    name: cli-cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Rebuild architecture inventory on review branch
        if: github.ref_name == 'phase13.2-complete-review'
        run: npm run arch:build
      - run: node --test scripts/test-phase11.mjs scripts/test-phase12.mjs scripts/test-phase13.mjs
