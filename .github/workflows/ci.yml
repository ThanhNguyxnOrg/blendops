name: CI

on:
  push:
    branches: [main, phase13.2-complete-review]
    paths-ignore:
      - docs/audits/current/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blendops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@3b9ff6de3e26a64ab1fbe049abf5e2cfc34dc7f1
    with:
      job_name: Verify (BlendOps)
      node_version: "20"
      package_manager: npm
      cache: npm
      validation_command: npm run arch:build && npm run audit:sync-digest && npm run ci
