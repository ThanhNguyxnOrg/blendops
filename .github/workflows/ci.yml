name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/audits/current/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blendops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@ci-v1
    with:
      job_name: Verify (BlendOps)
      node_version: "20"
      fetch_depth: 0
      package_manager: npm
      cache: npm
      validation_command: npm run arch:build && npm run audit:sync-digest && npm run ci
